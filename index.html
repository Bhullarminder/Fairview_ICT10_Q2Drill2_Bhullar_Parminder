<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drill 2</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand text-white">ICT Club</span>
    </div>
</nav>

<div class="container bg-light p-4 mt-5 w-50 rounded shadow">

    <h3 class="text-center">ICT Club Membership</h3>

    <p class="text-center">
        Add your name to the list!!!!
    </p>

    <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" id="firstName" class="form-control" placeholder="Enter first name">
    </div>

    <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" id="lastName" class="form-control" placeholder="Enter last name">
    </div>

    <button py-click="add_members" class="btn btn-primary w-100">
        Submit
    </button>

    <div id="result" class="mt-4"></div>

</div>

<script type="py" src="main.py"></script>

</body>
</html>
